<title>Correos Navidad Gravity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,900;1,900&display=swap">
<style>
/* Marca Gravity Wave: fondo #01313D, Formentera #00ADB5 solo en detalles, Deep Blue #1E6778 para bloques.
   Antetítulo diminuto y espaciado sobre titular grande en Black. Radios 0–2 px.
   Tipografía: Cera Pro no está disponible completa, se usa Poppins (fallback oficial del manual). */
:root{
  --fondo:#01313D; --fondo2:#022A35; --deep:#1E6778; --formentera:#00ADB5; --blanco:#FFFFFF; --dark:#101820;
  --txt:#FFFFFF; --txt2:rgba(255,255,255,.72); --txt3:rgba(255,255,255,.5);
  --line:rgba(255,255,255,.14); --line2:rgba(255,255,255,.26);
  --panel:rgba(255,255,255,.04); --hover:rgba(255,255,255,.07); --sel:rgba(0,173,181,.14);
  --f:"Poppins","Cera Pro",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--fondo)}
body{color:var(--txt);font-family:var(--f);font-size:15px;line-height:1.6;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--formentera);outline-offset:2px}
::selection{background:var(--formentera);color:var(--dark)}

.eyebrow{font-weight:500;font-size:11.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--formentera);margin:0}
.wrap,.top-inner{max-width:1200px;margin:0 auto}

/* cabecera */
.top{padding:28px 16px 0;border-bottom:1px solid var(--line);background:var(--fondo2)}
.brandrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 32px}
.logo{width:150px;color:var(--blanco);flex:none}
.logo svg{display:block;width:100%;height:auto}
.headline{flex:1 1 380px;min-width:0}
.headline h1{font-weight:900;font-size:clamp(28px,4.4vw,44px);line-height:.96;letter-spacing:-.02em;text-transform:uppercase;margin:8px 0 0;text-wrap:balance}
.deadline{flex:0 1 260px;font-size:13px;color:var(--txt2);line-height:1.45;border-left:1px solid var(--formentera);padding-left:14px}
.deadline b{display:block;color:var(--blanco);font-weight:900;font-size:22px;letter-spacing:-.01em;text-transform:uppercase;line-height:1.05;margin-top:2px}
.people{display:flex;gap:0;margin-top:26px;overflow-x:auto}
.person-tab{background:transparent;border:0;border-bottom:3px solid transparent;padding:12px 22px 12px 0;margin-right:22px;color:var(--txt3);font-weight:900;font-size:17px;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.person-tab:hover{color:var(--txt)}
.person-tab[aria-selected="true"]{color:var(--blanco);border-bottom-color:var(--formentera)}
.person-tab small{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:0;color:var(--txt3)}

.wrap{padding:22px 16px 40px}
.subnav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--txt2);font-variant-numeric:tabular-nums}
.bar{flex:1;height:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--formentera);transition:width .3s}
.status{font-size:12.5px;color:var(--txt3);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--txt3)}
.dot.on{background:var(--formentera)}

.grid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;min-width:0}
.panel-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.panel-h h2{font-weight:900;font-size:19px;line-height:1.1;letter-spacing:-.01em;margin:0;min-width:0}
.panel-h h2 .co{display:block;font-weight:500;font-size:11.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--formentera);margin-bottom:5px}
.panel-b{padding:18px}
.side{display:grid;gap:20px;min-width:0;align-content:start}

.btn{border:1px solid var(--line2);background:transparent;border-radius:2px;padding:8px 14px;font-weight:500;font-size:13px;letter-spacing:.04em;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--blanco)}
.btn:hover{border-color:var(--blanco)}
.btn.primary{background:var(--blanco);border-color:var(--blanco);color:var(--fondo);font-weight:600}
.btn.primary:hover{background:var(--formentera);border-color:var(--formentera);color:var(--dark)}
.btn.ghost{border-color:transparent;color:var(--txt2)}
.btn.ghost:hover{color:var(--blanco)}
.btn.small{padding:5px 10px;font-size:12px}

/* lista */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.tools input[type=search]{flex:1 1 140px;min-width:0;border:1px solid var(--line2);border-radius:2px;padding:8px 10px;background:transparent}
.tools input::placeholder{color:var(--txt3)}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt2);cursor:pointer;white-space:nowrap}
.toggle input,.sent-cb,.sent-big input{accent-color:var(--formentera)}
.lt-actions{display:flex;gap:4px;width:100%}
.list{max-height:68vh;overflow:auto}
.tier{border-bottom:1px solid var(--line)}
.tier-h{position:sticky;top:0;z-index:1;width:100%;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:14px 16px;background:var(--fondo2);border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;color:var(--blanco)}
.tier-h:hover{background:#033441}
.tier-letter{font-weight:900;font-size:26px;line-height:.9;width:26px;color:var(--blanco)}
.tier-h[data-t="A"] .tier-letter{color:var(--formentera)}
.tier-name{font-weight:500;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--txt2)}
.tier-bar{height:3px;background:var(--line);min-width:30px}
.tier-bar i{display:block;height:100%;background:var(--formentera)}
.tier-n{font-family:var(--mono);font-size:12px;color:var(--txt2);font-variant-numeric:tabular-nums}
.chev{width:10px;height:10px;border-right:2px solid var(--txt2);border-bottom:2px solid var(--txt2);transform:rotate(45deg);margin:-4px 2px 0;transition:transform .2s}
.tier-h[aria-expanded="false"] .chev{transform:rotate(-45deg);margin:0 2px}
.tier-h[aria-expanded="false"]{border-bottom-color:transparent}
.co-h{padding:12px 16px 2px;font-weight:500;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--txt3)}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:5px 16px 5px 13px;border-left:3px solid transparent}
.crow:hover{background:var(--hover)}
.crow[aria-current="true"]{background:var(--sel);border-left-color:var(--formentera)}
.crow.sent .nm{color:var(--txt3);text-decoration:line-through;text-decoration-thickness:1px}
.sent-cb{width:17px;height:17px;cursor:pointer;margin:0}
.pick{border:0;background:transparent;text-align:left;padding:5px 0;cursor:pointer;min-width:0;display:flex;flex-direction:column;color:var(--blanco)}
.pick .nm{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .cg{font-size:12px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flags{display:flex;gap:4px}
.flag{font-weight:500;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:2px 6px;border-radius:2px;white-space:nowrap;border:1px solid var(--line2);color:var(--txt2)}
.flag.n25{border-color:var(--formentera);color:var(--formentera)}
.manual{border-top:1px solid var(--line)}
.manual summary{padding:14px 16px;cursor:pointer;font-weight:500;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--blanco)}
.manual summary:hover{color:var(--formentera)}
.manual form{padding:0 16px 16px}

.empty{padding:34px 22px;text-align:left;color:var(--txt2)}
.empty h3{font-weight:900;font-size:24px;line-height:1;letter-spacing:-.02em;text-transform:uppercase;color:var(--blanco);margin:8px 0 10px;text-wrap:balance}
.empty p{margin:0;max-width:44ch}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt2)}
.field input,.field textarea{border:1px solid var(--line2);border-radius:2px;padding:9px 11px;background:rgba(0,0,0,.12);width:100%;min-width:0}
.field textarea{resize:vertical;line-height:1.6}
.field code,.note code{font-family:var(--mono);font-size:12px;color:var(--formentera);letter-spacing:0;text-transform:none}
.fields{display:grid;gap:14px}

/* correo */
.mail{display:grid;gap:12px}
.mail-line{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:2px}
.mail-line .k{font-weight:500;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--txt3)}
.mail-line .v{min-width:0;overflow-wrap:anywhere;font-weight:600}
.body{background:var(--blanco);color:var(--dark);border-radius:2px;padding:22px 24px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:14.5px;max-width:72ch}
.body mark{background:var(--formentera);color:var(--dark);padding:0 3px;border-radius:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:13px;color:var(--txt2);margin:0}
.alert{font-size:13px;color:var(--blanco);background:var(--deep);border-left:3px solid var(--formentera);padding:10px 14px;margin:0}
.sent-big{display:inline-flex;align-items:center;gap:9px;font-weight:600;font-size:13px;padding:8px 14px;border:1px solid var(--line2);border-radius:2px;cursor:pointer}
.sent-big input{width:17px;height:17px;margin:0}
.sent-big.on{border-color:var(--formentera);color:var(--formentera)}
.edit-mail summary{padding:16px 18px;cursor:pointer;font-weight:900;font-size:16px;text-transform:uppercase;letter-spacing:-.01em;display:flex;gap:10px;align-items:baseline}
.edit-mail summary small{font-weight:500;font-size:11px;letter-spacing:.24em;color:var(--formentera)}
.edit-mail[open] summary{border-bottom:1px solid var(--line)}

.foot{max-width:1200px;margin:0 auto;padding:10px 16px 34px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;color:var(--blanco)}
.foot .pfo{width:92px}
.foot .pfo svg{display:block;width:100%;height:auto}
.foot span{font-size:12px;color:var(--txt3);letter-spacing:.06em}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--blanco);color:var(--fondo);padding:10px 18px;border-radius:2px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* reto 10 al día */
.person-tab.rk{margin-left:auto;margin-right:0;color:var(--formentera)}
.person-tab.rk[aria-selected="true"]{color:var(--blanco)}
.today{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:2px;padding:6px 12px;font-size:12.5px;color:var(--txt2);cursor:pointer;background:transparent}
.today b{font-weight:900;font-size:18px;color:var(--blanco);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.today.done{border-color:var(--formentera)}
.today.done b{color:var(--formentera)}
.pips{display:flex;gap:3px}
.pips i{width:6px;height:14px;background:var(--line)}
.pips i.on{background:var(--formentera)}
.rk-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.rk-head h2{font-weight:900;font-size:clamp(26px,4vw,40px);line-height:.96;letter-spacing:-.02em;text-transform:uppercase;margin:8px 0 0}
.rk-head p{margin:0;color:var(--txt2);max-width:46ch;font-size:14px}
.rk-list{display:grid;gap:14px}
.rk-card{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px 20px;align-items:center;padding:18px 20px;border:1px solid var(--line);background:var(--panel);border-radius:2px}
.rk-card.first{border-color:var(--formentera)}
.rk-pos{font-weight:900;font-size:48px;line-height:.9;color:var(--txt3);letter-spacing:-.03em}
.rk-card.first .rk-pos{color:var(--formentera)}
.rk-name{font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.rk-sub{font-size:12.5px;color:var(--txt2);margin-top:4px}
.rk-total{text-align:right}
.rk-total b{display:block;font-weight:900;font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rk-total span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3)}
.days{grid-column:2/-1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);padding:6px 4px;text-align:center;min-width:0;border-radius:2px}
.day .d{display:block;font-weight:500;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);white-space:nowrap;overflow:hidden}
.day .n{display:block;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums;color:var(--txt2)}
.day.ok{background:var(--formentera);border-color:var(--formentera)}
.day.ok .d,.day.ok .n{color:var(--dark)}
.day.hoy{border-color:var(--blanco)}
.day.miss .n{color:var(--txt3)}
.day.future{opacity:.45}
@media (max-width:600px){.rk-card{grid-template-columns:44px minmax(0,1fr) auto;padding:14px}.rk-pos{font-size:34px}.days{grid-column:1/-1}.day .d{font-size:8.5px;letter-spacing:.06em}}
@media (max-width:520px){.rk-long{display:none}.logo{width:110px}.person-tab{font-size:15px;margin-right:16px;padding-right:0}.person-tab small{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="top-inner">
    <div class="brandrow">
      <div class="logo"><svg viewBox="440 740 1170 492" fill="currentColor" role="img" aria-label="Gravity Wave"><polygon points="873.3,936.8 757.2,1223.8 733.7,1223.8 662,1076.4 589.8,1223.8 566.3,1223.8 450.2,936.8 532.2,936.8   585.1,1072.2 650,931.7 673.5,931.7 738.4,1072.2 791.4,936.8 "/><path d="M1035.7,1195.2H934.5l-10.2,23.5h-79l128.1-287h23.5l128.1,287h-79L1035.7,1195.2z M985.3,1070.9l-24.8,65.3  h49.1L985.3,1070.9z"/><polygon points="1372.2,936.8 1244.1,1223.8 1220.6,1223.8 1092.5,936.8 1175.8,936.8 1232.6,1075.2 1288.9,936.8 "/><polygon points="1401.3,936.8 1596.8,936.8 1596.8,1003 1474.7,1003 1474.7,1041.9 1561.8,1041.9 1561.8,1103.3   1474.7,1103.3 1474.7,1152.5 1602,1152.5 1602,1218.6 1401.3,1218.6 "/><path d="M520,747.7c23.5,0,42.8,10.1,55.2,28.6l-23.3,19.8c-8.4-11.7-18.5-17.7-32.5-17.7c-21.6,0-35,14.2-35,35.8  c0,22,14.2,36.7,36.9,36.7c12.2,0,22-4.3,28.2-11.5v-6h-29.9v-28.8H583v40.4c-6,10.7-14.6,19.3-25.7,25.9  c-11.1,6.4-23.5,9.7-37.3,9.7c-38.5,0.6-70.4-29.4-69.8-66.5C449.6,777.3,481.5,747.1,520,747.7"/><path d="M736.6,878.3l-29-39.9h-13.8v39.9h-33.4V750h50.4c28.6,0,49.6,17.5,49.6,44.1c0,15.7-7.6,28.8-20.2,36.6  l33.8,47.6H736.6z M693.8,809.3h17.1c9.3,0,15.4-6,15.4-15.2c0-9.1-6-15-15.4-15h-17.1V809.3z"/><path d="M919.7,867.7h-46.1l-4.7,10.7h-36l58.3-130.6H902l58.3,130.6h-36L919.7,867.7z M896.8,811.1l-11.3,29.7h22.4  L896.8,811.1z"/><polygon points="1131.3,750 1072.9,880.7 1062.2,880.7 1003.9,750 1041.8,750 1067.7,813 1093.3,750 "/><rect x="1202.8" y="750" width="33.4" height="128.3"/><polygon points="1347.9,780.2 1309.4,780.2 1309.4,750 1419.8,750 1419.8,780.2 1381.3,780.2 1381.3,878.3   1347.9,878.3 "/><polygon points="1558,829.2 1558,878.3 1524.6,878.3 1524.6,829.6 1480.5,750 1517.4,750 1541.3,794.8 1565.2,750   1602,750 "/></svg></div>
      <div class="headline"><p class="eyebrow">Campaña de Navidad 2026 · Clientes Gravity</p><h1>Correos a clientes</h1></div>
      <div class="deadline">Personalizados con acabado Marsella, pedido antes del<b>6 de noviembre</b></div>
    </div>
    <nav class="people" role="tablist" id="people"></nav>
  </div>
</header>

<main class="wrap">
  <div class="subnav" id="subnav">
    <div class="progress" style="flex:1 1 240px;max-width:420px"><div class="bar"><i id="bar"></i></div><span id="count">0 de 0 enviados</span></div>
    <button class="today" id="today" data-go-rank="1" title="Ver el ranking"></button>
    <div class="status" id="status"><span class="dot"></span><span>Conectando…</span></div>
  </div>

  <section id="ranking" hidden></section>
  <div class="grid" id="main-grid">
    <div class="panel">
      <div class="tools">
        <input type="search" id="q" placeholder="Buscar…" aria-label="Buscar contactos">
        <label class="toggle"><input type="checkbox" id="hide-sent"> Ocultar enviados</label>
        <div class="lt-actions"><button class="btn small ghost" data-act="open-all">Abrir todos</button><button class="btn small ghost" data-act="close-all">Cerrar todos</button></div>
      </div>
      <div class="list" id="list"></div>
      <details class="manual" id="manual-box">
        <summary>+ Añadir un contacto a mano</summary>
        <form id="manual" class="fields">
          <div class="field"><label for="m-nombre">Nombre</label><input id="m-nombre" required autocomplete="off"></div>
          <div class="field"><label for="m-empresa">Empresa</label><input id="m-empresa" required autocomplete="off"></div>
          <div class="field"><label for="m-email">Correo</label><input id="m-email" type="email" required autocomplete="off"></div>
          <div><button class="btn primary" type="submit">Añadir</button></div>
        </form>
      </details>
    </div>
    <div class="side">
      <div class="panel" id="preview"></div>
      <details class="panel edit-mail" id="edit-box">
        <summary><span>Editar mi correo</span><small id="edit-who"></small></summary>
        <div class="panel-b fields">
          <div class="field"><label for="e-asunto">Asunto</label><input id="e-asunto"></div>
          <div class="field"><label for="e-cuerpo">Texto. <code>{nombre}</code> y <code>{empresa}</code> se rellenan solos con cada contacto</label><textarea id="e-cuerpo" rows="14"></textarea></div>
          <div class="field"><label for="e-firma">Firma (sale donde pone <code>{firma}</code>)</label><textarea id="e-firma" rows="3"></textarea></div>
          <div class="field"><label for="s-web">Enlace a la web de Navidad (común para los tres, sale donde pone <code>{web}</code>)</label><input id="s-web" type="url" placeholder="https://…"></div>
          <div class="actions"><button class="btn small ghost" data-act="restore">Volver al texto base</button><span class="note">Se guarda solo.</span></div>
        </div>
      </details>
    </div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<textarea id="clip" aria-hidden="true" tabindex="-1" style="position:fixed;left:-9999px;top:0;opacity:0"></textarea>

<script>
(function(){
const PEOPLE=[{id:'amaia',name:'Amaia'},{id:'julen',name:'Julen'},{id:'alvaro',name:'Álvaro'}];
const TIERS=[['A','Tier A'],['B','Tier B'],['C','Tier C'],['M','Añadidos a mano']];
const BASE={asunto:'Ya estamos con la Navidad en Gravity',cuerpo:`Hola {nombre}:

¿Qué tal? Espero que este mensaje te encuentre muy bien.

Te escribo porque quería que fueras de los primeros en enterarte: estamos lanzando la campaña de Navidad de Gravity Wave. Hemos preparado una colección de regalos para empresas (estrellas, árbol, posavasos, portamóvil y llaveros a medida), todo hecho con redes de pesca recuperadas del Mediterráneo y personalizado con el logo de {empresa}.

Te adjunto el catálogo, y aquí puedes verlo todo con calma: {web}

La gran novedad de este año es el acabado Marsella. Si os apetece hacer algo personalizado con este acabado, es importante que nos hagáis el pedido antes del 6 de noviembre, para que nos dé tiempo a fabricarlo y llegue perfecto a Navidad.

Si te encaja, dime más o menos cuántas unidades tenéis en mente y te preparo una propuesta. Y para cualquier duda, aquí me tienes.

¡Un abrazo!
{firma}`};

/* ---------- reto 10 al día ---------- */
const GOAL=10;
const DAYS=['2026-10-08','2026-10-09','2026-10-12','2026-10-13','2026-10-14','2026-10-15','2026-10-16'];
const dkey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const dlabel=k=>{const d=new Date(k+'T12:00:00');return d.toLocaleDateString('es-ES',{weekday:'short'}).replace('.','')+' '+d.getDate();};
function perDay(pid){const m={};contacts(pid).forEach(c=>{if(c.enviado&&c.enviadoEn){const k=dkey(c.enviadoEn);m[k]=(m[k]||0)+1;}});return m;}
function stats(pid){const m=perDay(pid),today=dkey(Date.now());
  const total=DAYS.reduce((a,k)=>a+(m[k]||0),0),done=DAYS.filter(k=>(m[k]||0)>=GOAL).length;
  let streak=0;for(const k of DAYS){if(k>today)break;if((m[k]||0)>=GOAL)streak++;else if(k<today)streak=0;}
  return {m,today:m[today]||0,total,done,streak,inReto:DAYS.includes(today)};}

/* ---------- estado ---------- */
const S={web:'',tpl:{},people:{},mode:'connecting',readonly:false,savedAt:0};
PEOPLE.forEach(p=>S.people[p.id]={firma:'',contactos:{}});
const ui={active:'amaia',sel:{},q:'',hideSent:false,open:{},view:'persona'};
try{const sv=JSON.parse(localStorage.getItem('gw-nav-ui2')||'{}');if(sv.active)ui.active=sv.active;if(sv.sel)ui.sel=sv.sel;ui.hideSent=!!sv.hideSent;if(sv.open)ui.open=sv.open;if(sv.view)ui.view=sv.view;}catch(e){}
const h0=location.hash.replace('#','');if(PEOPLE.some(p=>p.id===h0)){ui.active=h0;ui.view='persona';}if(h0==='ranking')ui.view='ranking';
function saveUi(){try{localStorage.setItem('gw-nav-ui2',JSON.stringify({active:ui.active,sel:ui.sel,hideSent:ui.hideSent,open:ui.open,view:ui.view}))}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const pname=id=>(PEOPLE.find(p=>p.id===id)||{}).name||id;
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function deepMerge(a,b){for(const k in b){if(isObj(b[k])){if(!isObj(a[k]))a[k]={};deepMerge(a[k],b[k]);}else a[k]=b[k];}return a;}
const clone=o=>JSON.parse(JSON.stringify(o));
const cap=s=>String(s||'').trim().toLowerCase().replace(/(^|[\s\-'])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
function contacts(pid=ui.active){return Object.entries(S.people[pid].contactos||{}).filter(([,c])=>c&&!c.borrado).map(([id,c])=>({...c,id}))
  .sort((a,b)=>(TIERS.findIndex(t=>t[0]===a.tier)-TIERS.findIndex(t=>t[0]===b.tier))||(a.orden||0)-(b.orden||0));}
const tplOf=(pid=ui.active)=>Object.assign({},BASE,S.tpl[pid]||{});

/* ---------- guardado ---------- */
let db=null;const writers={},acc={},exists={};
function queueWrite(key,fn){const w=writers[key]||(writers[key]={busy:false,pending:null});w.pending=fn;if(!w.busy)runW(w);renderStatus();}
async function runW(w){w.busy=true;while(w.pending){const f=w.pending;w.pending=null;try{await f()}catch(e){writeError(e)}}w.busy=false;S.savedAt=Date.now();renderStatus();setTimeout(renderStatus,4200);}
const busy=k=>writers[k]&&(writers[k].busy||writers[k].pending);
const anyBusy=()=>Object.values(writers).some(w=>w.busy||w.pending);
function writeError(e){if(e&&e.code==='invalid_argument'){S.readonly=true;toast('No tienes permiso para guardar cambios. Pide acceso de Colaborador');}else toast('No se ha podido guardar. Revisa la conexión');renderStatus();}
function persistLocal(){if(S.mode!=='local')return;try{localStorage.setItem('gw-nav-data2',JSON.stringify({web:S.web,tpl:S.tpl,people:S.people}))}catch(e){}S.savedAt=Date.now();renderStatus();}
function patchPerson(pid,patch){
  deepMerge(S.people[pid],clone(patch));
  if(S.mode!=='db'){persistLocal();return;}
  acc[pid]=deepMerge(acc[pid]||{},clone(patch));
  queueWrite('p:'+pid,async()=>{const p=acc[pid];acc[pid]=null;if(!p)return;const ref=db.doc('personas/'+pid);
    if(exists[pid])await ref.update(p);else{await ref.set(clone(S.people[pid]));exists[pid]=true;}});
}
function saveTpl(pid){if(S.mode!=='db'){persistLocal();return;}const d={...tplOf(pid)};queueWrite('t:'+pid,()=>db.doc('plantillas/'+pid).set(d));}
function saveWeb(){if(S.mode!=='db'){persistLocal();return;}const w=S.web;queueWrite('s',()=>db.doc('ajustes/general').set({web:w}));}

async function connect(){
  let d=null;try{d=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){}
  if(!d){S.mode='local';
    try{const x=JSON.parse(localStorage.getItem('gw-nav-data2')||'null');if(x){S.web=x.web||'';S.tpl=x.tpl||{};Object.assign(S.people,x.people||{});}}catch(e){}
    renderAll();return;}
  db=d;S.mode='db';renderStatus();
  db.doc('ajustes/general').onSnapshot(s=>{if(busy('s'))return;S.web=(s.exists&&s.data().web)||'';renderAll();},onErr);
  PEOPLE.forEach(p=>db.doc('plantillas/'+p.id).onSnapshot(s=>{if(busy('t:'+p.id))return;if(s.exists)S.tpl[p.id]={...s.data()};else delete S.tpl[p.id];renderAll();},onErr));
  db.collection('personas').onSnapshot(snap=>{snap.docs.forEach(d=>{exists[d.id]=true;if(busy('p:'+d.id)||acc[d.id])return;const v=clone(d.data()||{});S.people[d.id]={firma:v.firma||'',contactos:isObj(v.contactos)?v.contactos:{}};});renderAll();},onErr);
}
function onErr(){S.mode='error';renderStatus();}

/* ---------- texto ---------- */
function fill(str,c,pid=ui.active){
  const p=S.people[pid];const v={nombre:cap(c.nombre),empresa:(c.empresa||'').trim()||'[EMPRESA]',web:(S.web||'').trim()||'[ENLACE WEB]',firma:(p.firma||'').trim()||pname(pid),mi_nombre:pname(pid)};
  return String(str||'').replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m).replace(/(¡?Hola)\s+([:,!])/g,'$1$2');
}
const mark=s=>esc(s).replace(/\[(EMPRESA|ENLACE WEB)\]/g,'<mark>[$1]</mark>');

function copy(text,label){
  const done=()=>toast(label+' copiado');
  const fb=()=>{const t=$('#clip');t.value=text;t.select();try{document.execCommand('copy');done()}catch(e){toast('Selecciona el texto y cópialo a mano')}};
  try{navigator.clipboard.writeText(text).then(done,fb)}catch(e){fb()}
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000);}

/* ---------- render ---------- */
function renderStatus(){
  const map={connecting:['','Conectando…'],db:['on','Guardado y compartido con el equipo'],local:['local','Guardado solo en este navegador'],error:['local','Sin conexión: los cambios pueden no guardarse']};
  let [cls,txt]=map[S.mode]||map.connecting;if(S.readonly){cls='local';txt='Solo lectura: pide acceso de Colaborador'}
  else if(S.mode==='db'){if(anyBusy())txt='Guardando…';else if(S.savedAt&&Date.now()-S.savedAt<4000)txt='Cambios guardados ✓';}
  $('#status').innerHTML=`<span class="dot ${cls}"></span><span>${txt}</span>`;
}
function renderPeople(){
  $('#people').innerHTML=PEOPLE.map(p=>{const cs=contacts(p.id);const n=cs.filter(c=>c.enviado).length;
    return `<button class="person-tab" role="tab" data-p="${p.id}" aria-selected="${ui.view==='persona'&&p.id===ui.active}">${p.name}<small>${cs.length?n+'/'+cs.length:''}</small></button>`}).join('')
    +`<button class="person-tab rk" role="tab" data-rank="1" aria-selected="${ui.view==='ranking'}">Ranking<span class="rk-long"> · 10 al día</span></button>`;
}
function renderList(){
  const cs=contacts(),sent=cs.filter(c=>c.enviado).length;
  $('#count').textContent=`${sent} de ${cs.length} enviados`;$('#bar').style.width=(cs.length?sent/cs.length*100:0)+'%';
  $('#hide-sent').checked=ui.hideSent;
  const q=ui.q.trim().toLowerCase();
  const vis=cs.filter(c=>(!ui.hideSent||c.enviado!==true||c.id===ui.sel[ui.active])&&(!q||[c.nombre,c.apellidos,c.empresa,c.email,c.cargo].join(' ').toLowerCase().includes(q)));
  if(!cs.length){$('#list').innerHTML=`<div class="empty"><p class="eyebrow">Lista vacía</p><h3>Aún no hay contactos de ${esc(pname(ui.active))}</h3><p>Añade uno a mano aquí abajo.</p></div>`;return;}
  if(!vis.length&&q){$('#list').innerHTML=`<div class="empty"><p>Nadie coincide con la búsqueda.</p></div>`;return;}
  let html='';
  const op=ui.open[ui.active]||{};
  TIERS.forEach(([t,label])=>{const all=cs.filter(c=>(c.tier||'M')===t);if(!all.length)return;const g=vis.filter(c=>(c.tier||'M')===t);
    const done=all.filter(c=>c.enviado).length;const isOpen=q?g.length>0:(t in op?op[t]:t==='A');
    html+=`<div class="tier"><button class="tier-h" data-tier="${t}" data-t="${t}" aria-expanded="${isOpen}"><span class="tier-letter">${t==='M'?'+':t}</span><span class="tier-name">${label}</span><span class="tier-bar"><i style="width:${(done/all.length*100).toFixed(1)}%"></i></span><span class="tier-n">${done}/${all.length}</span><span class="chev" aria-hidden="true"></span></button>`;
    if(isOpen){
      if(!g.length)html+=`<div class="empty" style="padding:14px 16px"><p>${q?'Sin coincidencias en este tier.':'Todos enviados en este tier.'}</p></div>`;
      let lastCo=null;
      g.forEach(c=>{const co=(c.empresa||'').trim();
        if(co!==lastCo){html+=`<div class="co-h">${esc(co||'Sin empresa')}</div>`;lastCo=co;}
        html+=`<div class="crow ${c.enviado?'sent':''}" aria-current="${ui.sel[ui.active]===c.id}">
          <input type="checkbox" class="sent-cb" data-sent="${c.id}" ${c.enviado?'checked':''} aria-label="Enviado a ${esc(cap(c.nombre))}">
          <button class="pick" data-c="${c.id}"><span class="nm">${esc(cap(c.nombre))} ${esc(c.apellidos?cap(c.apellidos):'')}</span><span class="cg">${esc(c.cargo||c.email)}</span></button>
          <span class="flags">${c.n25?'<span class="flag n25" title="Compró en Navidad 2025">Navidad 25</span>':''}${c.verificar?'<span class="flag" title="'+esc(c.verificar)+'">Verificar</span>':''}</span>
        </div>`;});
    }
    html+='</div>';
  });
  $('#list').innerHTML=html;
}
function current(){const cs=contacts();return cs.find(c=>c.id===ui.sel[ui.active])||null;}
function renderPreview(){
  const box=$('#preview');const c=current();
  if(!c){box.innerHTML=`<div class="empty"><p class="eyebrow">Paso 1</p><h3>Elige un contacto de la lista</h3><p>Te aparecerá su correo listo para copiar y pegar. Cuando lo envíes, márcalo con el check.</p></div>`;box._data=null;return;}
  const t=tplOf();const subj=fill(t.asunto,c),body=fill(t.cuerpo,c);
  const gmail=`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(c.email)}&su=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
  box.innerHTML=`
  <div class="panel-h"><h2><span class="co">${esc(c.empresa)}</span>${esc(cap(c.nombre))} ${esc(c.apellidos?cap(c.apellidos):'')}</h2>
    <label class="sent-big ${c.enviado?'on':''}"><input type="checkbox" data-sent="${c.id}" ${c.enviado?'checked':''}> ${c.enviado?'Enviado':'Marcar como enviado'}</label></div>
  <div class="panel-b mail">
    ${c.verificar?`<p class="alert">Ojo: ${esc(c.verificar)}. Confírmalo antes de enviar.</p>`:''}
    ${!S.web?`<p class="alert">Falta el enlace a la web: ponlo en «Editar mi correo», abajo.</p>`:''}
    <div class="mail-line"><span class="k">Para</span><span class="v">${esc(c.email)}</span><button class="btn small" data-copy="to">Copiar</button></div>
    <div class="mail-line"><span class="k">Asunto</span><span class="v">${mark(subj)}</span><button class="btn small" data-copy="subj">Copiar</button></div>
    <div class="body">${mark(body)}</div>
    <div class="actions">
      <button class="btn primary" data-copy="body">Copiar texto</button>
      <a class="btn" href="${esc(gmail)}" target="_blank" rel="noopener">Abrir en Gmail</a>
      ${c.tier==='M'?`<button class="btn ghost small" data-act="del">Quitar contacto</button>`:''}
    </div>
    <p class="note">📎 Acuérdate de adjuntar el catálogo PDF.</p>
  </div>`;
  box._data={to:c.email,subj,body};
}
function renderEditor(){
  const t=tplOf();$('#edit-who').textContent='de '+pname(ui.active);
  [['e-asunto',t.asunto],['e-cuerpo',t.cuerpo],['e-firma',S.people[ui.active].firma||''],['s-web',S.web]].forEach(([id,v])=>{const el=$('#'+id);if(document.activeElement!==el)el.value=v;});
  $('#e-firma').placeholder=pname(ui.active)+'\nGravity Wave';
}
function renderToday(){const st=stats(ui.active),el=$('#today');const n=Math.min(st.today,GOAL);
  el.className='today'+(st.today>=GOAL?' done':'');
  el.innerHTML=st.inReto?`<span>Hoy</span><b>${st.today}/${GOAL}</b><span class="pips">${Array.from({length:GOAL},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`:`<span>Reto 10 al día · ${st.total} enviados</span>`;}
function renderRanking(){
  const today=dkey(Date.now());
  const rows=PEOPLE.map(p=>({...p,...stats(p.id)})).sort((a,b)=>b.total-a.total||b.done-a.done||b.today-a.today);
  const left=DAYS.filter(k=>k>=today).length;
  $('#ranking').innerHTML=`<div class="rk-head"><div><p class="eyebrow">Reto · del 8 al 16 de octubre</p><h2>10 correos al día</h2></div>
    <p>Cada día laborable, 10 correos enviados y marcados con el check. Gana quien más envíe hasta el viernes 16. ${left?`Quedan ${left} ${left===1?'día':'días'}, ${left*GOAL} correos por cabeza.`:'Reto terminado.'}</p></div>
  <div class="rk-list">${rows.map((r,i)=>`<div class="rk-card ${i===0&&r.total>0?'first':''}">
    <div class="rk-pos">${i+1}</div>
    <div><div class="rk-name">${r.name}</div><div class="rk-sub">${r.done} ${r.done===1?'día cumplido':'días cumplidos'} de ${DAYS.length}${r.streak>1?` · racha de ${r.streak}`:''}${r.inReto?` · hoy ${r.today}/${GOAL}${r.today>=GOAL?' ✓':''}`:''}</div></div>
    <div class="rk-total"><b>${r.total}</b><span>de ${DAYS.length*GOAL}</span></div>
    <div class="days">${DAYS.map(k=>{const n=r.m[k]||0;const cls=n>=GOAL?'ok':(k>today?'future':(k<today?'miss':''));
      return `<div class="day ${cls} ${k===today?'hoy':''}" title="${n} enviados"><span class="d">${dlabel(k)}</span><span class="n">${k>today?'·':n}</span></div>`}).join('')}</div>
  </div>`).join('')}</div>`;}
function renderAll(){renderStatus();renderPeople();renderToday();
  const rk=ui.view==='ranking';$('#ranking').hidden=!rk;$('#main-grid').hidden=rk;$('#subnav').hidden=rk;
  if(rk){renderRanking();return;}
  renderList();renderPreview();renderEditor();}

/* ---------- acciones ---------- */
function setSent(id,val){const pid=ui.active;patchPerson(pid,{contactos:{[id]:{enviado:val,enviadoEn:val?new Date().toISOString():null}}});
  if(val&&ui.sel[pid]===id){const cs=contacts(pid),i=cs.findIndex(c=>c.id===id);const nx=cs.slice(i+1).find(c=>!c.enviado);if(nx)ui.sel[pid]=nx.id;saveUi();}
  const st=stats(pid);toast(val?(st.inReto&&st.today===GOAL?'¡Reto de hoy cumplido! 10 de 10':(st.inReto&&st.today<GOAL?`Enviado · llevas ${st.today}/${GOAL} hoy`:'Marcado como enviado')):'Desmarcado');renderAll();}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tier){const t=b.dataset.tier;const op=ui.open[ui.active]||(ui.open[ui.active]={});op[t]=b.getAttribute('aria-expanded')!=='true';saveUi();renderList();return;}
  if(b.dataset.act==='open-all'||b.dataset.act==='close-all'){const v=b.dataset.act==='open-all';ui.open[ui.active]=Object.fromEntries(TIERS.map(t=>[t[0],v]));saveUi();renderList();return;}
  if(b.dataset.rank||b.dataset.goRank){ui.view='ranking';history.replaceState(null,'','#ranking');saveUi();renderAll();return;}
  if(b.dataset.p){ui.active=b.dataset.p;ui.view='persona';history.replaceState(null,'','#'+ui.active);saveUi();renderAll();return;}
  if(b.dataset.c){ui.sel[ui.active]=b.dataset.c;saveUi();renderList();renderPreview();if(innerWidth<860)$('#preview').scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(b.dataset.copy){const d=$('#preview')._data;if(!d)return;({to:()=>copy(d.to,'Correo'),subj:()=>copy(d.subj,'Asunto'),body:()=>copy(d.body,'Texto')})[b.dataset.copy]();return;}
  if(b.dataset.act==='restore'){S.tpl[ui.active]={...BASE};saveTpl(ui.active);renderAll();toast('Texto base recuperado');}
  if(b.dataset.act==='del'){const c=current();if(c&&c.tier==='M'){patchPerson(ui.active,{contactos:{[c.id]:{borrado:true}}});ui.sel[ui.active]=null;renderAll();toast('Contacto quitado');}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sent){setSent(t.dataset.sent,t.checked);return;}
  if(t.id==='hide-sent'){ui.hideSent=t.checked;saveUi();renderList();}
});
const timers={};const debounce=(k,fn)=>{clearTimeout(timers[k]);timers[k]=setTimeout(fn,600);};
document.addEventListener('input',e=>{
  const t=e.target,pid=ui.active;
  if(t.id==='q'){ui.q=t.value;renderList();return;}
  if(t.id==='e-asunto'||t.id==='e-cuerpo'){S.tpl[pid]=Object.assign(tplOf(pid),{[t.id==='e-asunto'?'asunto':'cuerpo']:t.value});renderPreview();debounce('t'+pid,()=>saveTpl(pid));return;}
  if(t.id==='e-firma'){const v=t.value;S.people[pid].firma=v;renderPreview();debounce('f'+pid,()=>patchPerson(pid,{firma:v}));return;}
  if(t.id==='s-web'){S.web=t.value;renderPreview();debounce('w',saveWeb);return;}
});
$('#manual').addEventListener('submit',e=>{e.preventDefault();
  const email=$('#m-email').value.trim();
  if(contacts().some(c=>(c.email||'').toLowerCase()===email.toLowerCase())){toast('Ese correo ya está en tu lista');return;}
  const id='m-'+uid();const c={tier:'M',nombre:$('#m-nombre').value.trim(),apellidos:'',empresa:$('#m-empresa').value.trim(),email,cargo:'',enviado:false,orden:Date.now()};
  patchPerson(ui.active,{contactos:{[id]:c}});(ui.open[ui.active]||(ui.open[ui.active]={})).M=true;e.target.reset();ui.sel[ui.active]=id;saveUi();renderAll();toast('Contacto añadido');});

renderAll();connect();
})();
</script>
