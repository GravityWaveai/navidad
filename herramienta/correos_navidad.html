<title>Correos Navidad Gravity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra petróleo con las tres personas como pestañas; debajo, lista de contactos a la izquierda y el correo listo para copiar a la derecha. */
:root{
  --bg:#F3F7F6; --surface:#FFFFFF; --surface2:#E8F0EF; --fg:#0B2A31; --muted:#557479;
  --line:#D3E2E0; --petrol:#0B3A44; --brand:#1E6778; --aqua:#2FA899; --aqua-soft:#D6F1ED;
  --on-petrol:#EAF6F4; --on-petrol-muted:#93C2C0; --warn:#9A5B00; --warn-soft:#FFF1DA;
  --danger:#A3322A; --ok:#1C7A5A; --ok-soft:#DDF3EA;
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#061F26; --surface:#0B2E36; --surface2:#0F3A43; --fg:#EAF6F4; --muted:#8FB4B4;
  --line:#1A4A53; --petrol:#04181D; --brand:#5FC9BD; --aqua:#5FC9BD; --aqua-soft:#12434A;
  --on-petrol:#EAF6F4; --on-petrol-muted:#8FB4B4; --warn:#F0C27A; --warn-soft:#3A2F17;
  --danger:#F08A80; --ok:#7FD9B5; --ok-soft:#12402F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#061F26; --surface:#0B2E36; --surface2:#0F3A43; --fg:#EAF6F4; --muted:#8FB4B4;
  --line:#1A4A53; --petrol:#04181D; --brand:#5FC9BD; --aqua:#5FC9BD; --aqua-soft:#12434A;
  --on-petrol:#EAF6F4; --on-petrol-muted:#8FB4B4; --warn:#F0C27A; --warn-soft:#3A2F17;
  --danger:#F08A80; --ok:#7FD9B5; --ok-soft:#12402F; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}

.top{background:var(--petrol);color:var(--on-petrol);padding:18px 16px 0}
.top-inner,.wrap{max-width:1180px;margin:0 auto}
.brandline{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.brandline h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.brandline h1 span{color:var(--on-petrol-muted);font-weight:600}
.deadline{font-size:13px;color:var(--on-petrol-muted)}
.deadline b{color:var(--on-petrol);font-weight:700}
.people{display:flex;gap:4px;margin-top:16px;overflow-x:auto}
.person-tab{background:transparent;border:0;border-radius:10px 10px 0 0;padding:10px 18px 12px;color:var(--on-petrol-muted);font-family:var(--f-display);font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.person-tab:hover{color:var(--on-petrol)}
.person-tab[aria-selected="true"]{background:var(--bg);color:var(--fg)}
.person-tab small{font-family:var(--f-mono);font-weight:500;font-size:12px;opacity:.8}

.wrap{padding:18px 16px 48px}
.subnav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.local{background:var(--warn)}

.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.panel-h h2{font-family:var(--f-display);font-size:15px;font-weight:700;margin:0}
.panel-b{padding:16px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--surface)}
:root[data-theme="dark"] .btn.primary{color:#04181D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#04181D}}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--aqua);border-radius:99px;transition:width .3s}

.tools{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.tools input[type=search]{flex:1 1 160px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg)}
.chips{display:flex;gap:4px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--aqua-soft);border-color:var(--aqua);color:var(--fg)}

.list{max-height:62vh;overflow:auto}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:transparent;border-left:3px solid transparent;border-top:0;border-right:0}
.row:hover{background:var(--surface2)}
.row[aria-current="true"]{background:var(--aqua-soft);border-left-color:var(--aqua)}
.row .who{min-width:0}
.row .co{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pp{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent;flex:none}
.row.sent .check{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.row.sent .co{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}

.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--fg);font-size:16px;margin:0 0 6px}
.empty p{margin:0 auto 14px;max-width:44ch}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);width:100%;min-width:0}
.field textarea{resize:vertical;line-height:1.55}
.fields{display:grid;gap:12px}
.fields.two{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.mail{display:grid;gap:12px}
.mail-line{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.mail-line .k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mail-line .v{min-width:0;overflow-wrap:anywhere;font-weight:600}
.body{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:16px 18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;max-width:72ch}
.body mark{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.note.warn{color:var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:8px}
.example-flag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:2px 8px;border-radius:99px}

.vars{display:flex;flex-wrap:wrap;gap:6px}
.var{font-family:var(--f-mono);font-size:12.5px;border:1px dashed var(--brand);color:var(--brand);background:transparent;border-radius:6px;padding:3px 8px;cursor:pointer}
.tpl-list .row{grid-template-columns:minmax(0,1fr) auto}

.import{display:grid;gap:14px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--aqua);background:var(--aqua-soft)}
.drop b{color:var(--fg)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface2);font-size:12px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--petrol);color:var(--on-petrol);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.howto div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:13.5px;color:var(--muted)}
.howto b{display:block;color:var(--fg);font-family:var(--f-display);font-size:14px;margin-bottom:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* v3 sencilla */
.side{display:grid;gap:18px;min-width:0;align-content:start}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.list{max-height:70vh}
.tier-h{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface2);font-family:var(--f-display);font-weight:700;font-size:13.5px;border-bottom:1px solid var(--line)}
.tier-badge{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--surface);background:var(--muted)}
.tier-badge.tA{background:var(--brand)} .tier-badge.tB{background:var(--aqua)} .tier-badge.tC{background:var(--muted)} .tier-badge.tM{background:var(--warn)}
.tier-n{margin-left:auto;font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--muted)}
.co-h{padding:8px 16px 2px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 16px;border-left:3px solid transparent}
.crow:hover{background:var(--surface2)}
.crow[aria-current="true"]{background:var(--aqua-soft);border-left-color:var(--aqua)}
.crow.sent .nm{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.sent-cb{width:18px;height:18px;accent-color:var(--ok);cursor:pointer;margin:0}
.pick{border:0;background:transparent;text-align:left;padding:4px 0;cursor:pointer;min-width:0;display:flex;flex-direction:column}
.pick .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .cg{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;white-space:nowrap}
.flag.n25{background:var(--ok-soft);color:var(--ok)}
.flag.ver{background:var(--warn-soft);color:var(--warn)}
.manual{border-top:1px solid var(--line)}
.manual summary{padding:12px 16px;cursor:pointer;font-weight:700;color:var(--brand)}
.manual form{padding:0 16px 16px}
.muted{color:var(--muted);font-weight:600}
.sent-big{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.sent-big input{width:18px;height:18px;accent-color:var(--ok);margin:0}
.sent-big.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.edit-mail summary{padding:14px 16px;cursor:pointer;font-family:var(--f-display);font-weight:700;display:flex;gap:8px;align-items:baseline}
.edit-mail summary small{font-family:var(--f-body);font-weight:600;color:var(--muted)}
.edit-mail[open] summary{border-bottom:1px solid var(--line)}
</style>

<header class="top">
  <div class="top-inner">
    <div class="brandline">
      <h1>Gravity Wave <span>· Correos de Navidad</span></h1>
      <div class="deadline">Personalizados con acabado Marsella: pedido antes del <b>6 de noviembre</b></div>
    </div>
    <nav class="people" role="tablist" id="people"></nav>
  </div>
</header>

<main class="wrap">
  <div class="subnav">
    <div class="progress" style="flex:1 1 240px;max-width:420px"><div class="bar"><i id="bar"></i></div><span id="count">0 de 0 enviados</span></div>
    <div class="status" id="status"><span class="dot"></span><span>Conectando…</span></div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="tools">
        <input type="search" id="q" placeholder="Buscar…" aria-label="Buscar contactos">
        <label class="toggle"><input type="checkbox" id="hide-sent"> Ocultar enviados</label>
      </div>
      <div class="list" id="list"></div>
      <details class="manual" id="manual-box">
        <summary>+ Añadir un contacto a mano</summary>
        <form id="manual" class="fields">
          <div class="field"><label for="m-nombre">Nombre</label><input id="m-nombre" required autocomplete="off"></div>
          <div class="field"><label for="m-empresa">Empresa</label><input id="m-empresa" required autocomplete="off"></div>
          <div class="field"><label for="m-email">Correo</label><input id="m-email" type="email" required autocomplete="off"></div>
          <div><button class="btn primary" type="submit">Añadir</button></div>
        </form>
      </details>
    </div>
    <div class="side">
      <div class="panel" id="preview"></div>
      <details class="panel edit-mail" id="edit-box">
        <summary><span>Editar mi correo</span><small id="edit-who"></small></summary>
        <div class="panel-b fields">
          <div class="field"><label for="e-asunto">Asunto</label><input id="e-asunto"></div>
          <div class="field"><label for="e-cuerpo">Texto. <code>{nombre}</code> y <code>{empresa}</code> se rellenan solos con cada contacto</label><textarea id="e-cuerpo" rows="14"></textarea></div>
          <div class="field"><label for="e-firma">Firma (sale donde pone <code>{firma}</code>)</label><textarea id="e-firma" rows="3"></textarea></div>
          <div class="field"><label for="s-web">Enlace a la web de Navidad (común para los tres, sale donde pone <code>{web}</code>)</label><input id="s-web" type="url" placeholder="https://…"></div>
          <div class="actions"><button class="btn small ghost" data-act="restore">Volver al texto base</button><span class="note">Se guarda solo.</span></div>
        </div>
      </details>
    </div>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<textarea id="clip" aria-hidden="true" tabindex="-1" style="position:fixed;left:-9999px;top:0;opacity:0"></textarea>

<script>
(function(){
const PEOPLE=[{id:'amaia',name:'Amaia'},{id:'julen',name:'Julen'},{id:'alvaro',name:'Álvaro'}];
const TIERS=[['A','Tier A'],['B','Tier B'],['C','Tier C'],['M','Añadidos a mano']];
const BASE={asunto:'Ya estamos con la Navidad en Gravity',cuerpo:`Hola {nombre}:

¿Qué tal? Espero que este mensaje te encuentre muy bien.

Te escribo porque quería que fueras de los primeros en enterarte: estamos lanzando la campaña de Navidad de Gravity Wave. Hemos preparado una colección de regalos para empresas (estrellas, árbol, posavasos, portamóvil y llaveros a medida), todo hecho con redes de pesca recuperadas del Mediterráneo y personalizado con el logo de {empresa}.

Te adjunto el catálogo, y aquí puedes verlo todo con calma: {web}

La gran novedad de este año es el acabado Marsella. Si os apetece hacer algo personalizado con este acabado, es importante que nos hagáis el pedido antes del 6 de noviembre, para que nos dé tiempo a fabricarlo y llegue perfecto a Navidad.

Si te encaja, dime más o menos cuántas unidades tenéis en mente y te preparo una propuesta. Y para cualquier duda, aquí me tienes.

¡Un abrazo!
{firma}`};

/* ---------- estado ---------- */
const S={web:'',tpl:{},people:{},mode:'connecting',readonly:false,savedAt:0};
PEOPLE.forEach(p=>S.people[p.id]={firma:'',contactos:{}});
const ui={active:'amaia',sel:{},q:'',hideSent:false};
try{const sv=JSON.parse(localStorage.getItem('gw-nav-ui2')||'{}');if(sv.active)ui.active=sv.active;if(sv.sel)ui.sel=sv.sel;ui.hideSent=!!sv.hideSent;}catch(e){}
const h0=location.hash.replace('#','');if(PEOPLE.some(p=>p.id===h0))ui.active=h0;
function saveUi(){try{localStorage.setItem('gw-nav-ui2',JSON.stringify({active:ui.active,sel:ui.sel,hideSent:ui.hideSent}))}catch(e){}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const pname=id=>(PEOPLE.find(p=>p.id===id)||{}).name||id;
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
function deepMerge(a,b){for(const k in b){if(isObj(b[k])){if(!isObj(a[k]))a[k]={};deepMerge(a[k],b[k]);}else a[k]=b[k];}return a;}
const clone=o=>JSON.parse(JSON.stringify(o));
const cap=s=>String(s||'').trim().toLowerCase().replace(/(^|[\s\-'])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
function contacts(pid=ui.active){return Object.entries(S.people[pid].contactos||{}).filter(([,c])=>c&&!c.borrado).map(([id,c])=>({...c,id}))
  .sort((a,b)=>(TIERS.findIndex(t=>t[0]===a.tier)-TIERS.findIndex(t=>t[0]===b.tier))||(a.orden||0)-(b.orden||0));}
const tplOf=(pid=ui.active)=>Object.assign({},BASE,S.tpl[pid]||{});

/* ---------- guardado ---------- */
let db=null;const writers={},acc={},exists={};
function queueWrite(key,fn){const w=writers[key]||(writers[key]={busy:false,pending:null});w.pending=fn;if(!w.busy)runW(w);renderStatus();}
async function runW(w){w.busy=true;while(w.pending){const f=w.pending;w.pending=null;try{await f()}catch(e){writeError(e)}}w.busy=false;S.savedAt=Date.now();renderStatus();setTimeout(renderStatus,4200);}
const busy=k=>writers[k]&&(writers[k].busy||writers[k].pending);
const anyBusy=()=>Object.values(writers).some(w=>w.busy||w.pending);
function writeError(e){if(e&&e.code==='invalid_argument'){S.readonly=true;toast('No tienes permiso para guardar cambios. Pide acceso de Colaborador');}else toast('No se ha podido guardar. Revisa la conexión');renderStatus();}
function persistLocal(){if(S.mode!=='local')return;try{localStorage.setItem('gw-nav-data2',JSON.stringify({web:S.web,tpl:S.tpl,people:S.people}))}catch(e){}S.savedAt=Date.now();renderStatus();}
function patchPerson(pid,patch){
  deepMerge(S.people[pid],clone(patch));
  if(S.mode!=='db'){persistLocal();return;}
  acc[pid]=deepMerge(acc[pid]||{},clone(patch));
  queueWrite('p:'+pid,async()=>{const p=acc[pid];acc[pid]=null;if(!p)return;const ref=db.doc('personas/'+pid);
    if(exists[pid])await ref.update(p);else{await ref.set(clone(S.people[pid]));exists[pid]=true;}});
}
function saveTpl(pid){if(S.mode!=='db'){persistLocal();return;}const d={...tplOf(pid)};queueWrite('t:'+pid,()=>db.doc('plantillas/'+pid).set(d));}
function saveWeb(){if(S.mode!=='db'){persistLocal();return;}const w=S.web;queueWrite('s',()=>db.doc('ajustes/general').set({web:w}));}

async function connect(){
  let d=null;try{d=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){}
  if(!d){S.mode='local';
    try{const x=JSON.parse(localStorage.getItem('gw-nav-data2')||'null');if(x){S.web=x.web||'';S.tpl=x.tpl||{};Object.assign(S.people,x.people||{});}}catch(e){}
    renderAll();return;}
  db=d;S.mode='db';renderStatus();
  db.doc('ajustes/general').onSnapshot(s=>{if(busy('s'))return;S.web=(s.exists&&s.data().web)||'';renderAll();},onErr);
  PEOPLE.forEach(p=>db.doc('plantillas/'+p.id).onSnapshot(s=>{if(busy('t:'+p.id))return;if(s.exists)S.tpl[p.id]={...s.data()};else delete S.tpl[p.id];renderAll();},onErr));
  db.collection('personas').onSnapshot(snap=>{snap.docs.forEach(d=>{exists[d.id]=true;if(busy('p:'+d.id)||acc[d.id])return;const v=clone(d.data()||{});S.people[d.id]={firma:v.firma||'',contactos:isObj(v.contactos)?v.contactos:{}};});renderAll();},onErr);
}
function onErr(){S.mode='error';renderStatus();}

/* ---------- texto ---------- */
function fill(str,c,pid=ui.active){
  const p=S.people[pid];const v={nombre:cap(c.nombre),empresa:(c.empresa||'').trim()||'[EMPRESA]',web:(S.web||'').trim()||'[ENLACE WEB]',firma:(p.firma||'').trim()||pname(pid),mi_nombre:pname(pid)};
  return String(str||'').replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m).replace(/(¡?Hola)\s+([:,!])/g,'$1$2');
}
const mark=s=>esc(s).replace(/\[(EMPRESA|ENLACE WEB)\]/g,'<mark>[$1]</mark>');

function copy(text,label){
  const done=()=>toast(label+' copiado');
  const fb=()=>{const t=$('#clip');t.value=text;t.select();try{document.execCommand('copy');done()}catch(e){toast('Selecciona el texto y cópialo a mano')}};
  try{navigator.clipboard.writeText(text).then(done,fb)}catch(e){fb()}
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000);}

/* ---------- render ---------- */
function renderStatus(){
  const map={connecting:['','Conectando…'],db:['on','Guardado y compartido con el equipo'],local:['local','Guardado solo en este navegador'],error:['local','Sin conexión: los cambios pueden no guardarse']};
  let [cls,txt]=map[S.mode]||map.connecting;if(S.readonly){cls='local';txt='Solo lectura: pide acceso de Colaborador'}
  else if(S.mode==='db'){if(anyBusy())txt='Guardando…';else if(S.savedAt&&Date.now()-S.savedAt<4000)txt='Cambios guardados ✓';}
  $('#status').innerHTML=`<span class="dot ${cls}"></span><span>${txt}</span>`;
}
function renderPeople(){
  $('#people').innerHTML=PEOPLE.map(p=>{const cs=contacts(p.id);const n=cs.filter(c=>c.enviado).length;
    return `<button class="person-tab" role="tab" data-p="${p.id}" aria-selected="${p.id===ui.active}">${p.name}<small>${cs.length?n+'/'+cs.length:''}</small></button>`}).join('');
}
function renderList(){
  const cs=contacts(),sent=cs.filter(c=>c.enviado).length;
  $('#count').textContent=`${sent} de ${cs.length} enviados`;$('#bar').style.width=(cs.length?sent/cs.length*100:0)+'%';
  $('#hide-sent').checked=ui.hideSent;
  const q=ui.q.trim().toLowerCase();
  const vis=cs.filter(c=>(!ui.hideSent||c.enviado!==true||c.id===ui.sel[ui.active])&&(!q||[c.nombre,c.apellidos,c.empresa,c.email,c.cargo].join(' ').toLowerCase().includes(q)));
  if(!cs.length){$('#list').innerHTML=`<div class="empty"><h3>Aún no hay contactos de ${esc(pname(ui.active))}</h3><p>Añade uno a mano aquí abajo.</p></div>`;return;}
  if(!vis.length){$('#list').innerHTML=`<div class="empty"><p>${q?'Nadie coincide con la búsqueda.':'¡Ya has enviado todos!'}</p></div>`;return;}
  let html='';
  TIERS.forEach(([t,label])=>{const g=vis.filter(c=>(c.tier||'M')===t);if(!g.length)return;const all=cs.filter(c=>(c.tier||'M')===t);
    html+=`<div class="tier-h"><span class="tier-badge t${t}">${t==='M'?'✎':t}</span>${label}<span class="tier-n">${all.filter(c=>c.enviado).length}/${all.length}</span></div>`;
    let lastCo=null;
    g.forEach(c=>{const co=(c.empresa||'').trim();
      if(co!==lastCo){html+=`<div class="co-h">${esc(co||'Sin empresa')}</div>`;lastCo=co;}
      html+=`<div class="crow ${c.enviado?'sent':''}" aria-current="${ui.sel[ui.active]===c.id}">
        <input type="checkbox" class="sent-cb" data-sent="${c.id}" ${c.enviado?'checked':''} aria-label="Enviado a ${esc(cap(c.nombre))}">
        <button class="pick" data-c="${c.id}"><span class="nm">${esc(cap(c.nombre))} ${esc(c.apellidos?cap(c.apellidos):'')}</span><span class="cg">${esc(c.cargo||c.email)}</span></button>
        ${c.n25?'<span class="flag n25" title="Compró en Navidad 2025">Navidad 25</span>':''}${c.verificar?'<span class="flag ver" title="'+esc(c.verificar)+'">Verificar</span>':''}
      </div>`;});
  });
  $('#list').innerHTML=html;
}
function current(){const cs=contacts();return cs.find(c=>c.id===ui.sel[ui.active])||null;}
function renderPreview(){
  const box=$('#preview');const c=current();
  if(!c){box.innerHTML=`<div class="empty"><h3>Elige un contacto de la lista</h3><p>Te aparecerá su correo listo para copiar y pegar. Cuando lo envíes, márcalo con el check.</p></div>`;box._data=null;return;}
  const t=tplOf();const subj=fill(t.asunto,c),body=fill(t.cuerpo,c);
  const gmail=`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(c.email)}&su=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
  box.innerHTML=`
  <div class="panel-h"><h2>${esc(cap(c.nombre))} ${esc(c.apellidos?cap(c.apellidos):'')} <span class="muted">· ${esc(c.empresa)}</span></h2>
    <label class="sent-big ${c.enviado?'on':''}"><input type="checkbox" data-sent="${c.id}" ${c.enviado?'checked':''}> ${c.enviado?'Enviado':'Marcar como enviado'}</label></div>
  <div class="panel-b mail">
    ${c.verificar?`<p class="note warn">Ojo: ${esc(c.verificar)}. Confírmalo antes de enviar.</p>`:''}
    ${!S.web?`<p class="note warn">Falta el enlace a la web: ponlo en «Editar mi correo», abajo.</p>`:''}
    <div class="mail-line"><span class="k">Para</span><span class="v">${esc(c.email)}</span><button class="btn small" data-copy="to">Copiar</button></div>
    <div class="mail-line"><span class="k">Asunto</span><span class="v">${mark(subj)}</span><button class="btn small" data-copy="subj">Copiar</button></div>
    <div class="body">${mark(body)}</div>
    <div class="actions">
      <button class="btn primary" data-copy="body">Copiar texto</button>
      <a class="btn" href="${esc(gmail)}" target="_blank" rel="noopener">Abrir en Gmail</a>
      ${c.tier==='M'?`<button class="btn ghost danger small" data-act="del">Quitar contacto</button>`:''}
    </div>
    <p class="note">📎 Acuérdate de adjuntar el catálogo PDF.</p>
  </div>`;
  box._data={to:c.email,subj,body};
}
function renderEditor(){
  const t=tplOf();$('#edit-who').textContent='de '+pname(ui.active);
  [['e-asunto',t.asunto],['e-cuerpo',t.cuerpo],['e-firma',S.people[ui.active].firma||''],['s-web',S.web]].forEach(([id,v])=>{const el=$('#'+id);if(document.activeElement!==el)el.value=v;});
  $('#e-firma').placeholder=pname(ui.active)+'\nGravity Wave';
}
function renderAll(){renderStatus();renderPeople();renderList();renderPreview();renderEditor();}

/* ---------- acciones ---------- */
function setSent(id,val){const pid=ui.active;patchPerson(pid,{contactos:{[id]:{enviado:val,enviadoEn:val?new Date().toISOString():null}}});
  if(val&&ui.sel[pid]===id){const cs=contacts(pid),i=cs.findIndex(c=>c.id===id);const nx=cs.slice(i+1).find(c=>!c.enviado);if(nx)ui.sel[pid]=nx.id;saveUi();}
  toast(val?'Marcado como enviado':'Desmarcado');renderAll();}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.p){ui.active=b.dataset.p;history.replaceState(null,'','#'+ui.active);saveUi();renderAll();return;}
  if(b.dataset.c){ui.sel[ui.active]=b.dataset.c;saveUi();renderList();renderPreview();if(innerWidth<860)$('#preview').scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(b.dataset.copy){const d=$('#preview')._data;if(!d)return;({to:()=>copy(d.to,'Correo'),subj:()=>copy(d.subj,'Asunto'),body:()=>copy(d.body,'Texto')})[b.dataset.copy]();return;}
  if(b.dataset.act==='restore'){S.tpl[ui.active]={...BASE};saveTpl(ui.active);renderAll();toast('Texto base recuperado');}
  if(b.dataset.act==='del'){const c=current();if(c&&c.tier==='M'){patchPerson(ui.active,{contactos:{[c.id]:{borrado:true}}});ui.sel[ui.active]=null;renderAll();toast('Contacto quitado');}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sent){setSent(t.dataset.sent,t.checked);return;}
  if(t.id==='hide-sent'){ui.hideSent=t.checked;saveUi();renderList();}
});
const timers={};const debounce=(k,fn)=>{clearTimeout(timers[k]);timers[k]=setTimeout(fn,600);};
document.addEventListener('input',e=>{
  const t=e.target,pid=ui.active;
  if(t.id==='q'){ui.q=t.value;renderList();return;}
  if(t.id==='e-asunto'||t.id==='e-cuerpo'){S.tpl[pid]=Object.assign(tplOf(pid),{[t.id==='e-asunto'?'asunto':'cuerpo']:t.value});renderPreview();debounce('t'+pid,()=>saveTpl(pid));return;}
  if(t.id==='e-firma'){const v=t.value;S.people[pid].firma=v;renderPreview();debounce('f'+pid,()=>patchPerson(pid,{firma:v}));return;}
  if(t.id==='s-web'){S.web=t.value;renderPreview();debounce('w',saveWeb);return;}
});
$('#manual').addEventListener('submit',e=>{e.preventDefault();
  const email=$('#m-email').value.trim();
  if(contacts().some(c=>(c.email||'').toLowerCase()===email.toLowerCase())){toast('Ese correo ya está en tu lista');return;}
  const id='m-'+uid();const c={tier:'M',nombre:$('#m-nombre').value.trim(),apellidos:'',empresa:$('#m-empresa').value.trim(),email,cargo:'',enviado:false,orden:Date.now()};
  patchPerson(ui.active,{contactos:{[id]:c}});e.target.reset();ui.sel[ui.active]=id;saveUi();renderAll();toast('Contacto añadido');});

renderAll();connect();
})();
</script>
